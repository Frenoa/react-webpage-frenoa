<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frenoa</title>
  <script>
    let savedTheme;
    try { savedTheme = localStorage.getItem('theme'); } catch {}
    document.documentElement.dataset.theme =
      savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <style>
    :root { color-scheme: light; --background: #fff; --text: #172033; --border: #cbd5e1; --hover: #f1f5f9; }
    :root[data-theme="dark"] { color-scheme: dark; --background: #111827; --text: #f3f4f6; --border: #64748b; --hover: #263247; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px; background: var(--background); color: var(--text); font-family: system-ui, sans-serif; }
    main { padding-top: 48px; }
    .theme-toggle { position: fixed; top: 20px; right: 20px; display: grid; place-items: center; width: 48px; height: 48px; padding: 12px; border: 1px solid var(--border); border-radius: 50%; color: var(--text); background: var(--background); cursor: pointer; }
    .theme-toggle:hover { background: var(--hover); }
    .theme-toggle:focus-visible { outline: 3px solid #3b82f6; outline-offset: 4px; }
    .theme-toggle svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sun { display: none; }
    [data-theme="dark"] .sun { display: block; }
    [data-theme="dark"] .moon { display: none; }
  </style>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="다크 모드로 전환" title="다크 모드로 전환">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.2A9 9 0 0 1 10.8 3.1a9 9 0 1 0 10.1 10.1Z"/></svg>
  </button>
  <main><h1>안녕</h1></main>
  <script>
    const themeButton = document.querySelector('.theme-toggle');
    function updateLabel() {
      const label = document.documentElement.dataset.theme === 'dark'
        ? '화이트 모드로 전환' : '다크 모드로 전환';
      themeButton.setAttribute('aria-label', label);
      themeButton.title = label;
    }
    themeButton.addEventListener('click', () => {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem('theme', theme); } catch {}
      updateLabel();
    });
    updateLabel();
  </script>
</body>
</html>
